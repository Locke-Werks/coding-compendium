  - id: h3-reviewing-a-diff-you-cannot-fully-read
    title: Reviewing a diff when you cannot read every line
    track: H
    order: 30
    owns: [review heuristics, scope checking, the review checklist]
    brief: >
      The most practically valuable section for a vibe coder. You are not
      auditing syntax. You are checking: is this the file I expected, is the
      change the size I expected, did it touch anything I did not ask about, did
      it delete a test, are there new dependencies, are there secrets. Checklist
      form. d9 owns the mechanics of reading diff syntax.
    see_also: [d9-reading-a-diff, e7-agent-failure-modes, h4-what-good-looks-like]

