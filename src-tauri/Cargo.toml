[package]
name = "coding-compendium"
version = "0.1.1"
description = "Offline reference for software development in the age of coding agents"
authors = ["Locke Werks"]
# Proprietary. See LICENSE at the repo root.
license = "LicenseRef-Proprietary"
publish = false
edition = "2021"
default-run = "coding-compendium"

[lib]
# The `_lib` suffix looks redundant and is not: without it the library and the
# binary share a name, which fails to link on Windows.
# https://github.com/rust-lang/cargo/issues/8519
name = "compendium_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "coding-compendium"
path = "src/main.rs"

# Compiles content/ into the SQLite database the app searches. A separate binary
# rather than a build script, because it is slow, it is run deliberately, and it
# will later need the same embedding model the app uses. Sharing that model
# through the library is what keeps the two from drifting into different vector
# spaces.
[[bin]]
name = "compile-content"
path = "src/bin/compile_content.rs"

# Tauri decides between loading the frontend from the dev server and serving the
# assets compiled into the binary on this feature alone, not on the build
# profile: its build script is literally `let dev = !custom_protocol`. So a
# `cargo build --release` without it produces an optimized, stripped, signed
# binary that opens to "localhost refused to connect", which is a shipping
# artifact that has never worked and looks exactly like one that does.
#
# `pnpm tauri dev` leaves it off. Everything that produces something to hand
# someone turns it on. scripts/stage-payload.ps1 refuses a binary built without
# it rather than trusting anyone to remember.
[features]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
# serde_yaml is unmaintained. serde_yaml_ng is the maintained fork.
serde_yaml_ng = "0.10"

# `bundled` compiles SQLite from source rather than linking whatever the system
# has, which on Windows is nothing. The bundled amalgamation is built with
# SQLITE_ENABLE_FTS5, which is the entire lexical half of this app; a system
# SQLite may well lack it, so bundling is a correctness requirement here rather
# than a convenience.
rusqlite = { version = "0.40", features = ["bundled", "functions"] }

# Local embedding model. Pulls in ONNX Runtime, which is statically linked as
# of ort rc.10, so no separate DLL ships beside the executable.
fastembed = "5"

regex = "1"
walkdir = "2.5"
# Digests the embedding weights so the app can refuse a model that did not build
# the vectors it is about to search. Nothing else here needs a hash.
sha2 = "0.10"
anyhow = "1"
thiserror = "2"
tauri-plugin-global-shortcut = "2.3.2"

[profile.release]
# The installer already carries 66 MB of embedding weights, so a few seconds of
# extra link time to shave the binary is worth it.
codegen-units = 1
lto = true
strip = true

# Measures retrieval quality against a fixed query set. Separate from the tests
# because it reports numbers to compare across changes rather than passing or
# failing.
[[bin]]
name = "evaluate"
path = "src/bin/evaluate.rs"
